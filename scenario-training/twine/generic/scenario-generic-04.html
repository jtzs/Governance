<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Generic Scenario 4</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:#eef0f3;color:#1f2328;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  #story{background:#fff;border:1px solid #e5e7eb;border-radius:8px;max-width:680px;width:100%;padding:32px 36px;line-height:1.65}
  h1{font-size:1.15rem;font-weight:700;margin-bottom:2px}
  .subtitle{font-size:.8rem;color:#57606a;margin-bottom:18px}
  p{font-size:.9rem;margin-bottom:12px}
  .card{background:#eef0f3;border:1px solid #e5e7eb;border-radius:6px;padding:13px 16px;margin-bottom:12px;font-size:.88rem}
  .card strong{display:block;margin-bottom:5px}
  ul{padding-left:17px;margin-top:4px} li{margin-bottom:3px;font-size:.88rem}
  .user-bg{background:#ffedd5;border-color:#fdba74}
  .staff-bg{background:#e0e7ff;border-color:#a5b4fc}
  .banner{display:flex;align-items:center;gap:9px;border-radius:6px;padding:9px 14px;margin-bottom:16px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .banner.user{background:#ffedd5;border:1px solid #fdba74;color:#9a3412}
  .banner.staff{background:#e0e7ff;border:1px solid #a5b4fc;color:#3730a3}
  .banner.waiting{background:#eef0f3;border:1px solid #e5e7eb;color:#57606a}
  .banner .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .banner.user .dot{background:#ea580c}
  .banner.staff .dot{background:#4f46e5}
  .banner.waiting .dot{background:#9ca3af}
  .choices{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  button{background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:11px 15px;text-align:left;cursor:pointer;font-size:.88rem;color:#1f2328;transition:all .15s;line-height:1.45}
  button:hover{border-color:#3b82d4;background:#f0f6ff}
  .btn-primary{background:#3b82d4;color:#fff;border-color:#3b82d4;font-weight:600;text-align:center}
  .btn-primary:hover{background:#2563b0;border-color:#2563b0}
  .btn-user{background:#ffedd5;border-color:#fdba74;color:#9a3412}
  .btn-user:hover{background:#ffedd5;border-color:#f97316}
  .btn-staff{background:#e0e7ff;border-color:#a5b4fc;color:#3730a3}
  .btn-staff:hover{background:#e0e7ff;border-color:#6366f1}
  .option-num{display:inline-block;min-width:22px;font-weight:700;opacity:.5;font-size:.78rem;margin-right:4px}
  .wait-box{border:2px dashed #e5e7eb;border-radius:8px;padding:22px 20px;text-align:center;margin:16px 0;color:#57606a;font-size:.9rem}
  .wait-box .wait-icon{font-size:1.8rem;margin-bottom:8px}
  .wait-box strong{color:#1f2328;display:block;margin-bottom:4px}
  .debrief-block{border-radius:6px;padding:13px 16px;margin-bottom:10px;font-size:.85rem;border:1px solid;line-height:1.6}
  .debrief-block.user{background:#ffedd5;border-color:#fdba74}
  .debrief-block.staff{background:#e0e7ff;border-color:#a5b4fc}
  .debrief-block .who{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;opacity:.7}
  .debrief-block .choice{font-weight:600;margin-bottom:4px}
  .debrief-block .said{font-style:italic;font-size:.86rem;margin-bottom:6px}
  .debrief-block .note{font-size:.82rem;color:#57606a;border-top:1px solid rgba(0,0,0,.08);padding-top:7px}
  .debrief-block.good{background:#f0fdf4;border-color:#86efac}
  .debrief-block.bad{background:#fef2f2;border-color:#fca5a5}
  hr.div{border:none;border-top:1px solid #e5e7eb;margin:18px 0}
  footer{text-align:center;font-size:.7rem;color:#57606a;border-top:1px solid #e5e7eb;margin-top:22px;padding-top:12px}
</style>
</head>
<body>
<div id="story"></div>
<script>
let myRole = null;
let userPicked = null;
let staffPicked = null;

const scenario = {
  title: 'Generic Scenario 4',
  scene: 'An employee overseas thinks they may have clicked a phishing link and entered their credentials. They contact the help desk to report it and request a credential reset.',

  user_handout: [
    'You are an employee currently overseas for a client presentation.',
    'You received an email that looked official, clicked a link, and entered your username and password before realising it might have been a phishing attempt.',
    'You cannot receive mobile-based verification (SMS or TOTP) as your phone is not working overseas.',
    'You have submitted a support ticket but want to call directly to stress the urgency.',
    '<em>Suggested lines: "I think I clicked a phishing link…" / "It looked completely official." / "I\'m overseas and can\'t get the SMS code."</em>'
  ],

  staff_handout: [
    'You are a <strong>Help Desk Support Technician</strong>.',
    'Policy: user identity must be verified via two independent factors before any account changes.',
    'Available methods: email OTP, call-back verification, password verification, Mobile TOTP.',
    'A phishing report is a security incident — credentials must be reset promptly, but verification still applies.',
    '<em>The caller\'s mobile is unavailable overseas. Email OTP and call-back are still available as verification channels.</em>'
  ],

  user: {
    prompt: 'You have reached the help desk. Choose how you report the incident and request a reset.',
    options: [
      { label: 'Straightforward report with urgency',
        line: '"Hi, I think I just clicked a phishing link and entered my password. I\'m overseas right now and I can\'t get the SMS code — can you reset my credentials urgently?"' },
      { label: 'Apologetic and anxious',
        line: '"I\'m so sorry to bother you — I think I did something really stupid. I clicked a link in an email and typed my password before I realised. I\'m overseas and I really need this fixed."' },
      { label: 'Pushing for immediate action without verification',
        line: '"My credentials are definitely compromised — someone could be in my account right now. I need you to reset everything immediately, I can\'t wait for OTP codes."' }
    ]
  },

  staff: {
    prompt: 'The caller says they may have entered their credentials on a phishing site and cannot receive SMS verification. Choose your response.',
    options: [
      { label: 'Verify by email OTP, then reset credentials',
        line: '"Thank you for reporting this quickly — that\'s exactly the right thing to do. I\'ll send a one-time code to your registered email to verify your identity, then I\'ll reset your credentials and flag the incident for the security team."',
        rating: 'good',
        debrief: 'Correct. Reporting a phishing click promptly is the right behaviour and should be encouraged. However, verification still applies before any credential change — even in an incident. Email OTP is available without the mobile phone and satisfies one factor. Flagging for the security team ensures the incident is properly investigated.' },
      { label: 'Reset immediately — the report itself proves identity',
        line: '"Don\'t worry — since you\'re the one reporting it, I\'ll go ahead and reset everything for you now."',
        rating: 'bad',
        debrief: 'Reporting an incident does not verify identity. An attacker who has obtained credentials may call to trigger a reset before the real user does, knowing this approach is likely to succeed. Verification must still take place, even in urgent incident scenarios.' },
      { label: 'Tell them to wait until they return',
        line: '"I\'m sorry, but without mobile verification I can\'t process this. You\'ll need to follow up when you\'re back."',
        rating: 'bad',
        debrief: 'Delaying a credential reset after a confirmed phishing click leaves potentially compromised credentials active. Email OTP and call-back verification are available alternatives. Telling the caller to wait is both a security risk and contrary to the available verification options.' }
    ]
  }
};

function render(html) {
  document.getElementById('story').innerHTML = html + `<footer>${scenario.title.split(' - ')[0]}</footer>`;
  window.scrollTo(0, 0);
}
function banner(type) {
  const cfg={user:['user','🎭 Your turn — User'],staff:['staff','🛡️ Your turn — Staff'],waiting:['waiting','⏳ Waiting…']}[type];
  return `<div class="banner ${cfg[0]}"><span class="dot"></span>${cfg[1]}</div>`;
}
function showStart() {
  render(`<h1>Generic Scenario 4</h1><div class="card"><strong>How this works</strong> Each player opens this file on their own device and selects a role. The User goes first — pick an approach and act it out. Then the Staff player picks their response. A debrief is shown at the end.</div><div class="card">${scenario.scene}</div><div class="choices"><button class="btn-user" onclick="pickRole('user')">🎭 I am the <strong>User</strong></button><button class="btn-staff" onclick="pickRole('staff')">🛡️ I am the <strong>Staff</strong></button></div>`);
}
function pickRole(r){myRole=r;showHandout();}
function showHandout(){
  const items=(myRole==='user'?scenario.user_handout:scenario.staff_handout).map(t=>`<li>${t}</li>`).join('');
  const cls=myRole==='user'?'user-bg':'staff-bg',emoji=myRole==='user'?'🎭':'🛡️',label=myRole==='user'?'User':'Staff';
  const hint=myRole==='user'?'You go first. Click below when both players are ready.':'The User goes first. Click below when both players are ready.';
  const nextFn=myRole==='user'?`showUserTurn()`:`showStaffWaiting()`;
  render(`<h1>Your Handout</h1><p class="subtitle">${scenario.title}</p><div class="card ${cls}"><strong>${emoji} ${label} — read before you begin</strong><ul style="margin-top:8px">${items}</ul></div><p style="font-size:.84rem;color:#57606a">${hint}</p><div class="choices"><button class="btn-primary" onclick="${nextFn}">▶ Ready</button></div>`);
}
function showUserTurn(){
  const opts=scenario.user.options.map((o,i)=>`<button class="btn-user" onclick="userPick(${i})"><span class="option-num">${i+1}.</span><strong>${o.label}</strong><br><span style="font-size:.82rem;opacity:.8;font-style:italic">${o.line}</span></button>`).join('');
  render(`${banner('user')}<h1>Calling the Help Desk</h1><p>${scenario.user.prompt}</p><div class="choices">${opts}</div>`);
}
function userPick(idx){
  userPicked=idx;const opt=scenario.user.options[idx];
  render(`${banner('user')}<h1>You said…</h1><div class="card user-bg"><strong>${opt.label}</strong><div style="margin-top:6px;font-style:italic;font-size:.88rem">${opt.line}</div></div><div class="wait-box"><div class="wait-icon">⏳</div><strong>Waiting for the staff player to respond…</strong>When they have finished, click Done.</div><div class="choices"><button class="btn-primary" onclick="showDebrief()">Done ▶</button></div>`);
}
function showStaffWaiting(){
  render(`${banner('waiting')}<h1>User Is Going First…</h1><p style="font-size:.85rem;color:#57606a">The user player is making their approach. Pay attention — then click Continue when they have finished.</p><div class="choices"><button class="btn-primary" onclick="showStaffTurn()">▶ Continue</button></div>`);
}
function showStaffTurn(){
  const opts=scenario.staff.options.map((o,i)=>`<button class="btn-staff" onclick="staffPick(${i})"><span class="option-num">${i+1}.</span><strong>${o.label}</strong><br><span style="font-size:.82rem;opacity:.8;font-style:italic">${o.line}</span></button>`).join('');
  render(`${banner('staff')}<h1>How Do You Respond?</h1><p>${scenario.staff.prompt}</p><div class="choices">${opts}</div>`);
}
function staffPick(idx){
  staffPicked=idx;const opt=scenario.staff.options[idx];
  render(`${banner('staff')}<h1>You said…</h1><div class="card staff-bg"><strong>${opt.label}</strong><div style="margin-top:6px;font-style:italic;font-size:.88rem">${opt.line}</div></div><div class="wait-box"><div class="wait-icon">⏳</div><strong>Waiting for the user player to finish…</strong>When they have clicked Done, click Done here too.</div><div class="choices"><button class="btn-primary" onclick="showDebrief()">Done ▶</button></div>`);
}
function showDebrief(){
  const uOpt=userPicked!==null?scenario.user.options[userPicked]:null;
  const sOpt=staffPicked!==null?scenario.staff.options[staffPicked]:null;
  const uBlock=uOpt?`<div class="debrief-block user"><div class="who">🎭 User</div><div class="choice">${uOpt.label}</div><div class="said">${uOpt.line}</div></div>`:'';
  const sBlock=sOpt?`<div class="debrief-block staff ${sOpt.rating}"><div class="who">🛡️ Staff</div><div class="choice">${sOpt.label}</div><div class="said">${sOpt.line}</div><div class="note">${sOpt.debrief}</div></div>`:'';
  render(`<h1>Debrief</h1><p class="subtitle">${scenario.title}</p>${uBlock}${sBlock}<hr class="div"><div class="choices"><button class="btn-primary" onclick="restartScenario()">↩ Run again</button></div>`);
}
function restartScenario(){myRole=null;userPicked=null;staffPicked=null;showStart();}
showStart();
</script>
</body>
</html>
